[project]
name = "entari-plugin-permission"
version = "0.2.0"
description = "Permission system for Entari based on Cithun"
authors = [
    {"name" = "RF-Tar-Railt", "email" = "rf_tar_railt@qq.com"}
]
dependencies = [
    "arclet-entari>=0.19.4",
    "arclet-cithun>=1.4.0",
    "entari-plugin-user>=0.2.0",
    "entari-plugin-database>=0.4.2",
]
requires-python = ">=3.11"
readme = "README.md"
license = {"text" = "MIT"}

[dependency-groups]
dev = [
    "arclet-entari[cron,dotenv,reload,yaml]>=0.19.4",
    "satori-python-adapter-onebot11>=0.6.0",
    "entari-plugin-server>=0.8.2",
]
